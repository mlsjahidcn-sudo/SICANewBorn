openapi: 3.0.3
info:
  title: SICA B2B Catalog API
  version: '1.0.0'
  description: |
    Public catalog API for external integrators (affiliate sites, sister
    platforms, recruitment partners). Read-only access to SICA's
    university and program data, plus outbound webhooks for change
    notifications.

    ## Authentication
    Every request needs an `Authorization: Bearer sk_live_…` header.
    Issue a key from `/admin/api-keys` (admin-only). The plaintext is
    shown exactly once on creation; we only keep the SHA-256 hash.

    ## Rate limits
    Per-key token bucket, capacity = the limit set on the key
    (default 100 req/min, configurable per key at issue time). On
    overflow: HTTP 429 with `Retry-After`. Every response includes
    `X-RateLimit-Limit`, `X-RateLimit-Remaining`, `X-RateLimit-Reset`.

    ## Caching
    Responses are cached in-memory for 10 min, per (api_key_id,
    query_string). Cache status: `X-Cache: HIT | MISS | BYPASS`. Pass
    `?nocache=1` to bypass.

    ## Webhooks
    Subscribe to `university.*` and `program.*` events with
    `/v1/webhooks`. Every delivery is HMAC-SHA256 signed with your
    per-subscription secret (`X-SICA-Signature`). Verify with
    `timingSafeEqual` / `hmac.compare_digest`. At-least-once delivery
    — dedupe on `X-SICA-Delivery-Id`.

    ## Versioning
    The `/v1/` prefix is forever-stable. Breaking changes bump to
    `/v2/`. v1 will keep working for at least 12 months after v2
    ships.

    ## Quickstart
    ```bash
    curl -H "Authorization: Bearer sk_live_..." \
         "https://studyinchina.academy/v1/catalog/universities?city=Beijing&language=en&limit=5"
    ```
  contact:
    name: SICA API Support
    email: support@sica.com.cn
  license:
    name: Proprietary
    url: https://studyinchina.academy/legal/api-terms

servers:
  - url: https://studyinchina.academy
    description: Production
  - url: https://staging.studyinchina.academy
    description: Staging (sandbox data)

tags:
  - name: catalog
    description: Public university + program catalog
  - name: webhooks
    description: |
      Subscribe to catalog change events. SICA POSTs to your URL when
      a university or program is created, updated, or deleted. Every
      delivery is HMAC-SHA256 signed with the per-subscription secret
      shown once on create. At-least-once delivery; consumers MUST
      dedupe on the `X-SICA-Delivery-Id` header.

security:
  - BearerAuth: []

paths:
  /v1/catalog/universities:
    get:
      tags: [catalog]
      operationId: listUniversities
      summary: List universities
      description: |
        Paginated list of universities with optional filters. All
        filter params are AND-combined. Returns a stable public
        schema — no admin fields.

        **Language shaping**: `?language=en` returns only English
        fields (`*_cn` are nulled/emptied). `?language=zh` swaps
        the primary `name`/`city`/`description` to Chinese, falling
        back to English if the Chinese version is missing. Default
        `both` returns both.
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/City'
        - $ref: '#/components/parameters/Tag'
        - $ref: '#/components/parameters/UniversityType'
        - $ref: '#/components/parameters/MinRating'
        - $ref: '#/components/parameters/Language'
        - $ref: '#/components/parameters/UniversitySort'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: nocache
          in: query
          required: false
          description: Set to `1` to bypass the 10-min in-memory cache.
          schema:
            type: string
            enum: ['1']
      responses:
        '200':
          description: OK
          headers:
            X-Cache:
              $ref: '#/components/headers/XCache'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UniversitiesResponse'
              examples:
                default:
                  $ref: '#/components/examples/UniversitiesListExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /v1/catalog/universities/{slug}:
    get:
      tags: [catalog]
      operationId: getUniversity
      summary: Get a single university by slug
      parameters:
        - name: slug
          in: path
          required: true
          description: The university's URL slug (e.g. `tsinghua-university`).
          schema:
            type: string
        - $ref: '#/components/parameters/Language'
        - name: nocache
          in: query
          required: false
          schema:
            type: string
            enum: ['1']
      responses:
        '200':
          description: OK
          headers:
            X-Cache: { $ref: '#/components/headers/XCache' }
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
            X-RateLimit-Reset: { $ref: '#/components/headers/XRateLimitReset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UniversityResponse'
              examples:
                default:
                  $ref: '#/components/examples/UniversitySingleExample'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/catalog/programs:
    get:
      tags: [catalog]
      operationId: listPrograms
      summary: List programs
      description: |
        Paginated list of programs. `?university` filters by parent
        university slug. `?language` filters by instruction
        language (English | Chinese | Bilingual). `?scholarship=true`
        returns only programs with scholarships available.
      parameters:
        - $ref: '#/components/parameters/Q'
        - name: university
          in: query
          required: false
          description: Filter by parent university slug.
          schema:
            type: string
        - name: degree
          in: query
          required: false
          schema:
            type: string
            enum: [Bachelor, Master, PhD]
        - name: discipline
          in: query
          required: false
          description: Discipline filter (e.g. `Engineering`, `Business`).
          schema:
            type: string
        - name: language
          in: query
          required: false
          description: Filter by **instruction** language (not response language).
          schema:
            type: string
            enum: [English, Chinese, Bilingual]
        - name: scholarship
          in: query
          required: false
          description: '`true` returns only programs with scholarships available.'
          schema:
            type: boolean
        - $ref: '#/components/parameters/PageLanguage'
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [name, tuition, created_at]
            default: name
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: nocache
          in: query
          required: false
          schema:
            type: string
            enum: ['1']
      responses:
        '200':
          description: OK
          headers:
            X-Cache: { $ref: '#/components/headers/XCache' }
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
            X-RateLimit-Reset: { $ref: '#/components/headers/XRateLimitReset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramsResponse'
              examples:
                default:
                  $ref: '#/components/examples/ProgramsListExample'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/catalog/programs/{slug}:
    get:
      tags: [catalog]
      operationId: getProgram
      summary: Get a single program by slug
      parameters:
        - name: slug
          in: path
          required: true
          description: The program's URL slug.
          schema:
            type: string
        - $ref: '#/components/parameters/PageLanguage'
        - name: nocache
          in: query
          required: false
          schema:
            type: string
            enum: ['1']
      responses:
        '200':
          description: OK
          headers:
            X-Cache: { $ref: '#/components/headers/XCache' }
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
            X-RateLimit-Reset: { $ref: '#/components/headers/XRateLimitReset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/webhooks:
    get:
      tags: [webhooks]
      summary: List webhook subscriptions
      description: |
        Returns all subscriptions owned by the authenticated API key,
        newest first. The `secret` is never returned here — it is
        only shown once at create time.
      operationId: listWebhookSubscriptions
      responses:
        '200':
          description: Subscriptions
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscriptions:
                    type: array
                    items: { $ref: '#/components/schemas/WebhookSubscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

    post:
      tags: [webhooks]
      summary: Create a webhook subscription
      description: |
        Register a URL to receive event POSTs. The `secret` is
        generated server-side and returned in the response — this is
        the only time the secret will be shown. Store it server-side
        and use it to verify the `X-SICA-Signature` header on every
        incoming delivery.
      operationId: createWebhookSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url:
                  type: string
                  format: uri
                  description: 'https:// URL (http://localhost allowed for dev)'
                events:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items: { $ref: '#/components/schemas/WebhookEvent' }
                description:
                  type: string
                  maxLength: 200
      responses:
        '201':
          description: Subscription created
          content:
            application/json:
              schema:
                type: object
                required: [subscription, secret, secret_note]
                properties:
                  subscription: { $ref: '#/components/schemas/WebhookSubscription' }
                  secret:
                    type: string
                    description: 'HMAC-SHA256 secret. Shown exactly once.'
                  secret_note:
                    type: string
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/webhooks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }

    patch:
      tags: [webhooks]
      summary: Update a subscription
      description: |
        Update the URL, subscribed events, description, or active state.
        The `secret` is NOT updatable — to rotate the signing secret,
        create a new subscription and delete the old one. Updates are
        scoped to the authenticated key (a key cannot edit another
        key's subscriptions).
      operationId: updateWebhookSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                url: { type: string, format: uri }
                events:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items: { $ref: '#/components/schemas/WebhookEvent' }
                description:
                  type: string
                  maxLength: 200
                  nullable: true
                active: { type: boolean }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscription: { $ref: '#/components/schemas/WebhookSubscription' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

    delete:
      tags: [webhooks]
      summary: Disable a subscription (soft-revoke)
      description: |
        Sets `active = false` on the subscription. The row stays for
        audit; deliveries stop immediately. Re-enable by PATCHing
        `active: true`. Scoped to the authenticated key.
      operationId: deleteWebhookSubscription
      responses:
        '200':
          description: Disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscription:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      active: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sk_live_<base64>
      description: |
        API key in `Authorization: Bearer sk_live_…` format. Issue a
        key from `/admin/api-keys`. Required scope: `read:catalog`.

  parameters:
    Q:
      name: q
      in: query
      required: false
      description: Free-text search across name + city + Chinese equivalents.
      schema:
        type: string
        maxLength: 120
    City:
      name: city
      in: query
      required: false
      description: Filter by city (e.g. `Beijing`).
      schema:
        type: string
        maxLength: 80
    Tag:
      name: tag
      in: query
      required: false
      description: Filter by tag (e.g. `985`, `211`, `DFC`).
      schema:
        type: string
        maxLength: 40
    UniversityType:
      name: type
      in: query
      required: false
      description: Public or Private.
      schema:
        type: string
        enum: [Public, Private]
    MinRating:
      name: minRating
      in: query
      required: false
      description: Minimum rating on the 0-5 scale (inclusive).
      schema:
        type: number
        format: float
        minimum: 0
        maximum: 5
    Language:
      name: language
      in: query
      required: false
      description: |
        Response field shaping for the universities endpoint.
        `both` (default) returns both en + zh; `en` returns only
        English (zh fields nulled); `zh` swaps primary fields to
        Chinese.
      schema:
        type: string
        enum: [en, zh, both]
        default: both
    PageLanguage:
      name: pageLanguage
      in: query
      required: false
      description: |
        Response field shaping for the programs endpoint (named
        `pageLanguage` here to avoid collision with the program's
        own `language` field which refers to instruction language).
      schema:
        type: string
        enum: [en, zh, both]
        default: both
    UniversitySort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [ranking, rating, name, created_at]
        default: ranking
    Order:
      name: order
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
        default: asc
    Page:
      name: page
      in: query
      required: false
      description: 1-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      required: false
      description: Items per page. Max 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  headers:
    XCache:
      description: Cache status. `HIT` = served from in-memory cache, `MISS` = fresh fetch, `BYPASS` = `?nocache=1` used.
      schema:
        type: string
        enum: [HIT, MISS, BYPASS]
    XRateLimitLimit:
      description: Per-key request limit (per minute).
      schema:
        type: integer
    XRateLimitRemaining:
      description: Tokens remaining in the current bucket.
      schema:
        type: integer
    XRateLimitReset:
      description: Unix timestamp (seconds) when the bucket will be full.
      schema:
        type: integer

  responses:
    BadRequest:
      description: Invalid query parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, malformed, revoked, or expired API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: API key missing the required scope (`read:catalog`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Rate limit exceeded. Retry after the `Retry-After` seconds.
      headers:
        Retry-After:
          description: Seconds until the next token.
          schema:
            type: integer
        X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
        X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
        X-RateLimit-Reset: { $ref: '#/components/headers/XRateLimitReset' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    PublicUniversity:
      type: object
      description: |
        The public schema for a university. Admin-only fields like
        `internal_notes` are stripped. Both English and Chinese
        fields are present in the default `language=both` response;
        `language=en` nulls the `*_cn` fields, `language=zh` swaps
        the primary name/city/description to Chinese.
      required: [slug, name, city, ranking, rating]
      properties:
        slug: { type: string, example: tsinghua-university }
        name: { type: string, example: Tsinghua University }
        name_cn: { type: string, nullable: true, example: 清华大学 }
        city: { type: string, example: Beijing }
        city_cn: { type: string, nullable: true, example: 北京 }
        ranking: { type: integer, example: 1, description: 'Rank in China (1 = top).' }
        rating: { type: number, format: float, minimum: 0, maximum: 5, example: 4.9 }
        type: { type: string, example: Public }
        type_cn: { type: string, nullable: true, example: 公立 }
        established: { type: integer, example: 1911 }
        students: { type: string, example: '50,000+' }
        intl_students: { type: string, example: '8,000+' }
        description: { type: string }
        description_cn: { type: string }
        popular_programs:
          type: array
          items: { type: string }
          example: ['Computer Science', 'Electrical Engineering']
        popular_programs_cn:
          type: array
          items: { type: string }
        tuition_undergrad: { type: string, example: '¥30,000/year' }
        tuition_graduate: { type: string, example: '¥40,000/year' }
        intake: { type: string, example: 'September' }
        intake_cn: { type: string }
        disciplines:
          type: array
          items: { type: string }
          example: ['Engineering', 'Business', 'Sciences']
        logo: { type: string, format: uri, example: 'https://cdn.example.com/tsinghua.png' }
        image: { type: string, format: uri }
        qs_world_ranking: { type: integer, example: 25 }
        tags:
          type: array
          items: { type: string }
          example: ['985', '211', 'DFC']
        tags_cn:
          type: array
          items: { type: string }
        accommodation: { type: string }
        accommodation_cn: { type: string }
        accommodation_cost: { type: string }
        accommodation_cost_cn: { type: string }
        application_deadline:
          type: string
          nullable: true
          example: '2026-06-30'

    PublicProgram:
      type: object
      description: |
        The public schema for a program. Same language semantics as
        PublicUniversity.
      required: [slug, name, university_slug, degree, language]
      properties:
        slug: { type: string, example: tsinghua-cs-bsc }
        name: { type: string, example: 'BSc in Computer Science' }
        name_cn: { type: string, example: '计算机科学学士' }
        university_slug: { type: string, example: tsinghua-university }
        degree:
          type: string
          enum: [Bachelor, Master, PhD]
        discipline: { type: string, example: Computer Science }
        discipline_cn: { type: string, example: 计算机科学 }
        language:
          type: string
          description: Instruction language.
          enum: [English, Chinese, Bilingual]
        duration: { type: string, example: '4 years' }
        duration_cn: { type: string, example: '4年' }
        tuition: { type: string, example: '¥30,000/year' }
        description: { type: string }
        description_cn: { type: string }
        requirements:
          type: array
          items: { type: string }
          example: ['High school diploma', 'Math proficiency']
        requirements_cn:
          type: array
          items: { type: string }
        curriculum:
          type: array
          items: { type: string }
        curriculum_cn:
          type: array
          items: { type: string }
        scholarship_available: { type: boolean, example: true }
        intake: { type: string, example: 'September' }
        intake_cn: { type: string }

    Pagination:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        total: { type: integer, example: 105 }
        totalPages: { type: integer, example: 6 }

    UniversitiesResponse:
      type: object
      required: [data, pagination, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/PublicUniversity' }
        pagination: { $ref: '#/components/schemas/Pagination' }
        meta:
          type: object
          required: [language]
          properties:
            language:
              type: string
              enum: [en, zh, both]

    UniversityResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/PublicUniversity' }
        meta:
          type: object
          required: [language]
          properties:
            language:
              type: string
              enum: [en, zh, both]

    ProgramsResponse:
      type: object
      required: [data, pagination, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/PublicProgram' }
        pagination: { $ref: '#/components/schemas/Pagination' }
        meta:
          type: object
          required: [language]
          properties:
            language:
              type: string
              enum: [en, zh, both]

    ProgramResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/PublicProgram' }
        meta:
          type: object
          required: [language]
          properties:
            language:
              type: string
              enum: [en, zh, both]

    WebhookEvent:
      type: string
      enum:
        - university.created
        - university.updated
        - university.deleted
        - program.created
        - program.updated
        - program.deleted
      description: |
        Event identifier. Emitted as the value of the `X-SICA-Event`
        header on every delivery and inside the JSON payload's
        `event` field.

    WebhookSubscription:
      type: object
      required: [id, url, events, active, created_at, success_count, failure_count]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        events:
          type: array
          items: { $ref: '#/components/schemas/WebhookEvent' }
        description:
          type: string
          nullable: true
        active: { type: boolean }
        created_at: { type: string, format: date-time }
        last_triggered_at:
          type: string
          format: date-time
          nullable: true
        success_count: { type: integer, minimum: 0 }
        failure_count: { type: integer, minimum: 0 }

    WebhookDelivery:
      type: object
      description: |
        Read-only audit record of a single delivery attempt. The full
        body that was POSTed is available in the admin UI at
        `/admin/webhooks` (admin only).
      required: [id, event, status, attempt_count, created_at]
      properties:
        id: { type: string, format: uuid }
        event: { $ref: '#/components/schemas/WebhookEvent' }
        status:
          type: string
          enum: [pending, success, failed, dead]
          description: |
            * `pending` — queued, not yet attempted.
            * `success` — subscriber returned 2xx.
            * `failed` — non-2xx or network error, will retry per
              `next_retry_at`.
            * `dead` — 5 attempts exhausted, no more retries.
        http_status:
          type: integer
          nullable: true
        attempt_count: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        last_attempt_at:
          type: string
          format: date-time
          nullable: true
        next_retry_at:
          type: string
          format: date-time
          nullable: true
          description: 'When the worker will re-attempt this delivery. Null if dead or succeeded.'

    WebhookDeliveryPayload:
      type: object
      description: |
        The exact JSON body POSTed to the subscriber URL. The
        `X-SICA-Signature` header is `sha256=<hex>` of this body
        using the subscription's `secret`. The `X-SICA-Delivery-Id`
        header is the same as `delivery_id` here — use it for
        idempotency.
      required: [event, delivery_id, data]
      properties:
        event: { $ref: '#/components/schemas/WebhookEvent' }
        delivery_id:
          type: string
          format: uuid
          description: 'Idempotency key. Consumers MUST dedupe on this.'
        data:
          description: |
            The mutated resource. For `*.deleted` events, just
            `{ slug: string }` (the slug is the only field left after
            delete). For `*.created` / `*.updated`, the full
            `PublicUniversity` or `PublicProgram` shape (en + zh).
          oneOf:
            - $ref: '#/components/schemas/PublicUniversity'
            - $ref: '#/components/schemas/PublicProgram'
            - type: object
              properties:
                slug: { type: string }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string, example: 'Missing or malformed Authorization header.' }

