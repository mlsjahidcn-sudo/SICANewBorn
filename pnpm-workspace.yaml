# pnpm 11+ allowlist for postinstall scripts (S59). pnpm 11 moved
# `onlyBuiltDependencies` out of package.json — the new home is this
# file. Without these entries, `pnpm install` exits with code 1
# (`ERR_PNPM_IGNORED_BUILDS`) on the 5 packages below, which fails
# the Hostinger Cloud build.
#
# Format is a map (key → boolean), not a list. Re-run `pnpm install`
# after adding a new dep with a postinstall — pnpm will flag the new
# package in its "Ignored build scripts" list, append it here.
allowBuilds:
  '@sentry/cli': true
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true
